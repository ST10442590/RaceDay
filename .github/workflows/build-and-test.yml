name: Build and test Part 2 API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Part2-API/RaceDay.Part2.slnx

      - name: Build
        run: dotnet build Part2-API/RaceDay.Part2.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay.Part2.slnx --configuration Release --no-build --verbosity normal